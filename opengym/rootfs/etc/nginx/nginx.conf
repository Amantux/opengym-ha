# openGym add-on: nginx main config (ours).
#
# The server block is upstream's own web/nginx.conf.template, copied verbatim from the
# official web image and rendered at boot by opengym-entrypoint.sh into
# /etc/nginx/http.d/opengym.conf (contract §3). It listens on 127.0.0.1:8080 only; the
# gateway on :8099 is the sole client.
#
# nginx runs as the unprivileged `app` user (gosu), so there is no `user` directive (it only
# means something to a root master) and everything nginx writes (pid, temp files) lives in
# /var/lib/nginx/tmp, which the Dockerfile hands to `app`.

worker_processes 1;
pid /var/lib/nginx/tmp/nginx.pid;
# To the add-on log. The entrypoint also passes `-e stderr`, which covers the messages nginx
# writes before it has read this file (otherwise it opens the compiled-in log file first).
error_log stderr warn;
pcre_jit on;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    # Off: every request already passes through the gateway, and a line per exercise image
    # would bury the log lines that matter.
    access_log off;

    # Request bodies and proxied responses larger than the in-memory buffers spill here
    # (a whole-history PUT /api/data, a GET of a large profile).
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;

    # The real client address. Only the gateway connects here (from 127.0.0.1), and it
    # OVERWRITES X-Forwarded-For with its own socket peer on every request (contract §1), so
    # that header is trustworthy from loopback and from nowhere else. With this, upstream's
    # `proxy_set_header X-Forwarded-For $remote_addr` hands the api (TRUST_PROXY=1) the real
    # peer instead of 127.0.0.1, which keeps its sign-in throttle per client, not global.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    include /etc/nginx/http.d/opengym.conf;
}
