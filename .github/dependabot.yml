version: 2
updates:
  # GitHub Actions (keeps checkout/setup-* off deprecated runtimes). Every action
  # is pinned to a commit SHA with a version comment; Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # No "docker" entry, on purpose. The only images in opengym/Dockerfile are the
  # two upstream openGym ones, and the Upstream sync workflow
  # (.github/workflows/upstream-sync.yml) moves them hourly, together with
  # OPENGYM_VERSION and a changelog line, then lands them once CI passes.
  # Dependabot would open a second, half-done PR for every upstream release.

  # HA integration test harness (the `latest` leg of CI's ha-tests). Each harness
  # release pins one exact homeassistant, so a bump here is how a new HA reaches
  # CI — one reviewable PR per HA release.
  - package-ecosystem: "pip"
    directory: "/custom_components/opengym/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      ha-test-harness:
        update-types: ["minor", "patch"]   # majors get their own PR for review
    # requirements_test_min.txt pins the harness for the OLDEST HA we support
    # (hacs.json); bumping it would silently stop testing that floor. CI also
    # asserts its HA == hacs.json, in case this exclusion ever stops matching.
    exclude-paths:
      - "**/requirements_test_min.txt"

  # The lint toolchain (ruff, Pillow, PyYAML) in tools/requirements-lint.txt.
  # Pinned so CI and local runs agree; listed here so the pins do not rot.
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      lint-tools:
        update-types: ["minor", "patch"]   # majors get their own PR for review
