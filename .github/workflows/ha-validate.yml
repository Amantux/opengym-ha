name: HA validate

# Validates the two Home Assistant install paths this repo ships:
#   1. custom_components/opengym  -> HACS custom integration
#   2. opengym/config.yaml        -> Supervisor add-on (built locally, no image:)
# These are the checks behind the README badges. They are BLOCKING: a badge that
# stays green while the integration is unloadable is worse than no badge.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HA and HACS tighten their requirements over time; a repo that passed at
    # merge can fail months later without a single commit. Catch that. An odd
    # minute, so the run does not queue behind every top-of-the-hour schedule.
    - cron: "41 4 * * 1"

concurrency:
  # Cancel superseded runs on the same PR only; scheduled and push runs finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only everywhere: these jobs validate the checkout and publish nothing.
permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest (Home Assistant integration manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # only checks out and validates files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # home-assistant/actions has no release for hassfest, so the SHA is master
      # on the date shown (Dependabot moves it). The pin fixes the wrapper only:
      # it runs ghcr.io/home-assistant/hassfest at latest (read at this SHA),
      # which is the point — today's HA rules, run read-only.
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master @ 2026-07-30

  hacs:
    name: HACS (integration installability)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # the HACS action reads the repo + public API only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hacs/action's newest release tag (22.5.0) is from 2022, so the SHA is
      # main on the date shown (Dependabot moves it). The pin fixes the inputs
      # only: its action.yml runs docker://ghcr.io/hacs/action:main (read at this
      # SHA), i.e. HACS's current validator, read-only.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-06-08
        with:
          category: integration
          # `brands` checks that the domain is registered in home-assistant/brands,
          # a separate PR against an upstream repo we do not control and cannot
          # land from CI. Ignored deliberately, not silently dropped.
          ignore: brands

  addon-lint:
    name: Add-on + HACS metadata lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # only checks out and validates files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the lint toolchain (venv)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r tools/requirements-lint.txt
      # One script, so the rules live in one place with their reasons and every
      # failure says what to do: config.yaml (no image:, ingress, panel_admin,
      # options == schema, translations), the api image as the final FROM (no
      # build.yaml, no ARG BUILD_FROM), api/web/OPENGYM_VERSION on one upstream
      # release, version lockstep, the bundled integration identical to
      # custom_components/opengym, manifest key order, brand sizes + RGBA,
      # DOCS/CHANGELOG, repository.yaml and README buttons, hacs.json keys.
      - name: Add-on lint
        run: .venv/bin/python tools/addon_lint.py
