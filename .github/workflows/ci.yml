name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Upstream sync workflow dispatches CI on each upstream/opengym-X.Y.Z branch it pushes (a
  # push made with GITHUB_TOKEN starts no run). Every test job runs as for a push; bump-version
  # then lands that commit on main, and upstream-failed reports a release that cannot land.
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same PR; never cancel a push to the default
  # branch (protects the version bump + release from interruption).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: the test jobs install and run third-party code
# (upstream openGym's source and npm deps, the Home Assistant test harness), so
# they must NOT inherit a token that can push. The two jobs that write
# (bump-version, release) elevate themselves individually below.
permissions:
  contents: read

# There is deliberately NO image build/publish job (unlike myMeal/HomeHoard).
# opengym/config.yaml has no `image:` key, so the Supervisor builds the add-on
# locally on each user's machine FROM the official upstream openGym images,
# pinned by digest in opengym/Dockerfile's FROM lines. The exercise
# media inside the upstream web image is licensed for use within openGym only;
# publishing an image of our own would redistribute it. tools/addon_lint.py
# fails the build if an `image:` key ever appears. A release here is therefore
# only a git tag + GitHub release, which is what HACS offers as an update (the
# Supervisor reads opengym/config.yaml's version on main).

jobs:
  gateway:
    name: Gateway tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upstream release the add-on ships
        id: upstream
        # The one source of truth is the image tags in opengym/Dockerfile's FROM
        # lines, so an Upstream sync bump of the images re-runs this suite against
        # the matching upstream source with no second pin to forget.
        # Fails (and says why) if the api and web images disagree. Standard
        # library only: no venv exists yet.
        run: |
          version=$(python3 tools/addon_lint.py --upstream-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check out upstream openGym (source only, no media)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DuarteSantos8/openGym
          ref: v${{ steps.upstream.outputs.version }}
          path: upstream
          persist-credentials: false
          # What the gateway suite reads: api/queue.js (effectiveRoutineId, the
          # function production imports from /app) and frontend/src/lib/units.js
          # (live body-weight conversion parity). Neither needs node_modules.
          sparse-checkout: |
            api
            frontend/src/lib
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"  # the upstream api image (the add-on's base) runs Node 22
      - name: The checkout is that release
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          got=$(node -p "require('./upstream/api/package.json').version")
          if [ "$got" != "$VERSION" ]; then
            echo "::error::upstream tag v$VERSION holds api version $got, not $VERSION"
            exit 1
          fi
      - name: npm test
        working-directory: opengym/gateway
        env:
          UPSTREAM_API_DIR: ${{ github.workspace }}/upstream/api
          UPSTREAM_SRC: ${{ github.workspace }}/upstream
        run: npm test

  patch:
    name: Upstream patch + upstream api suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upstream release the add-on ships
        id: upstream
        # Same derivation as the gateway job (see there).
        run: |
          version=$(python3 tools/addon_lint.py --upstream-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check out upstream openGym (source only, no media)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DuarteSantos8/openGym
          ref: v${{ steps.upstream.outputs.version }}
          path: upstream
          persist-credentials: false
          # Upstream's api suite reads beyond api/: frontend/src/{lib,locales,views}
          # (payload parity, nudge copy, the Coach intake limits), web/, helm/,
          # kubernetes/ (the listen-port checks) and scripts/ (the api-docs tag
          # check). Measured on v1.4.1: with exactly these directories the suite's
          # result equals that of a checkout of everything but the media; with
          # api + frontend/src/lib alone, six more tests fail on missing files,
          # and run-tests.sh would then silently count them as "fails without the
          # patch too". catalogue/media (the licensed exercise media) is never
          # fetched.
          sparse-checkout: |
            api
            frontend/src/lib
            frontend/src/locales
            frontend/src/views
            web
            helm
            kubernetes
            scripts
      - name: Patch applies with no fuzz; upstream suite gains no failure; patch tests pass
        # run-tests.sh runs everything inside node:22-alpine (docker is on the
        # runner), mounting the checkout read-only.
        run: bash opengym/patches/run-tests.sh upstream

  lint:
    name: Lint (ruff, shellcheck, add-on lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"  # the oldest Python this code runs on (ruff.toml)
      - name: Install the lint toolchain (venv)
        # Pinned in one file that local runs use too, so CI lints with exactly
        # the ruff developers run; an unpinned ruff silently pulls releases whose
        # changed behaviour then fails CI on unrelated, pre-existing code.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r tools/requirements-lint.txt
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Shellcheck (entrypoint, integration installer, their tests)
        # PID 1 of the add-on: signal forwarding and privilege drop live here. The
        # installer writes into Home Assistant's configuration folder as root.
        # Pinned (v0.11.0) rather than the runner's own shellcheck, whose version
        # moves with the runner image and disagreed with local runs (SC2317/SC2329).
        # Locally: the same docker run.
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            opengym/rootfs/usr/local/bin/opengym-entrypoint.sh \
            opengym/rootfs/usr/local/bin/opengym-install-integration.sh \
            tests/installer/test-installer.sh tests/e2e/run.sh
      - name: Integration installer tests (busybox)
        # install_integration's installer against a scratch configuration folder:
        # HACS and hand-made copies untouched, no symlink followed, upgrades, never
        # a failed boot. In node:22-alpine, the add-on's own base, so it runs with
        # the same busybox the add-on ships.
        run: |
          docker run --rm -v "$PWD:/repo:ro" --tmpfs /w:exec --workdir=/w node:22-alpine \
            sh /repo/tests/installer/test-installer.sh
      - name: Add-on lint's own tests
        run: .venv/bin/python -m unittest discover -s tools/tests -v
      - name: Add-on lint
        run: .venv/bin/python tools/addon_lint.py

  ha-tests:
    # The matrix key in the name stops GitHub appending every matrix value, so
    # the checks read "HA integration (latest)" / "HA integration (minimum)".
    name: HA integration (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two Home Assistant versions, each from an exactly-pinned harness:
    # - latest: requirements_test.txt, bumped by Dependabot (py3.14: the current
    #   harness declares Requires-Python >=3.14).
    # - minimum: requirements_test_min.txt, the HA that hacs.json declares as our
    #   floor (2024.11.0; its harness requires py3.12). Without this leg a
    #   change that only works on new HA ships to users hacs.json still admits.
    strategy:
      fail-fast: false   # a minimum-HA break must not hide the latest result
      matrix:
        include:
          - ha: latest
            python: "3.14"
            requirements: requirements_test.txt
          - ha: minimum
            python: "3.12"
            requirements: requirements_test_min.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install harness (venv)
        # Into a dedicated venv, never the runner's interpreter: the harness pins
        # its own dependency set and downgrades whatever else lives there.
        env:
          REQUIREMENTS: custom_components/opengym/tests/${{ matrix.requirements }}
        run: |
          python -m venv .venv-ha
          .venv-ha/bin/python -m pip install --upgrade pip
          .venv-ha/bin/python -m pip install -r "$REQUIREMENTS"
      - name: Check minimum leg runs the declared minimum HA
        # requirements_test_min.txt is excluded from Dependabot; this catches it
        # drifting (a manual bump, or the exclusion not holding) from hacs.json.
        if: matrix.ha == 'minimum'
        run: |
          .venv-ha/bin/python - <<'EOF'
          import json
          from homeassistant.const import __version__ as installed
          declared = json.load(open("hacs.json"))["homeassistant"]
          assert installed == declared, f"minimum leg runs HA {installed}, hacs.json declares {declared}"
          print(f"minimum leg: HA {installed} == hacs.json")
          EOF
      - name: Run integration tests
        # asyncio_mode=auto: the async test fns have no per-test marker. sys.path
        # is fixed in the tests' conftest so `custom_components.opengym` imports.
        run: .venv-ha/bin/python -m pytest custom_components/opengym/tests -q -o asyncio_mode=auto

  changelog:
    # A PR that changes what users run must say so under "## Unreleased" in
    # opengym/CHANGELOG.md; bump-version promotes that heading to the release.
    # Dependency-manifest-only changes (Dependabot) and test-only changes are
    # exempt; other PRs that touch shipped paths without a user-visible change
    # opt out with the `skip-changelog` label (added after the PR opened? re-run
    # this job to pick it up). A PR that moves the upstream images by hand
    # (opengym/Dockerfile) is deliberately NOT exempt: a new openGym release is
    # the most user-visible change this add-on has. (Upstream sync's own commits
    # never open a PR: they bring their changelog line with them.)
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.txt"
      - name: Require an Unreleased entry
        env:
          CHANGED_LIST: ${{ runner.temp }}/changed.txt
          CHANGELOG: opengym/CHANGELOG.md
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          set -eu
          if [ "$SKIP_LABEL" = "true" ]; then
            echo "skip-changelog label set; not checking."; exit 0
          fi
          # Shipped paths: the add-on folder (Dockerfile, gateway, patches,
          # rootfs, docs) and the integration, minus tests and dependency
          # manifests (one bot PR per bump).
          shipped=$(grep -E '^(opengym/|custom_components/opengym/)' "$CHANGED_LIST" \
            | grep -vE '(^|/)(tests?)/|(^|/)(requirements[^/]*\.txt|package-lock\.json)$' || true)
          if [ -z "$shipped" ]; then
            echo "No shipped paths changed; no changelog entry needed."; exit 0
          fi
          echo "Shipped paths changed:"
          while IFS= read -r path; do echo "  $path"; done <<<"$shipped"
          if ! grep -qxF "$CHANGELOG" "$CHANGED_LIST"; then
            echo "::error file=$CHANGELOG::This PR changes shipped code but not $CHANGELOG. Add a user-facing bullet under '## Unreleased' (or label the PR skip-changelog)."
            exit 1
          fi
          # Non-blank lines between "## Unreleased" and the next "## " heading.
          body=$(awk '/^## Unreleased[ \t]*$/ {f=1; next} f && /^## / {exit} f && NF' "$CHANGELOG")
          if [ -z "$body" ]; then
            echo "::error file=$CHANGELOG::$CHANGELOG has no non-empty '## Unreleased' section. Put this PR's notes under that exact heading above the latest release."
            exit 1
          fi
          echo "Changelog entry found."

  smoke:
    name: Add-on image smoke (fake-ingress e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds the add-on image from opengym/ exactly as the Supervisor would
    # (FROM the pinned upstream images, patch applied at build) and drives it
    # through a fake ingress peer, confined by opengym/apparmor.txt like under
    # the Supervisor, with the fence around Home Assistant's configuration
    # folder checked. Only worth the build once the gateway and the patch are
    # known good.
    needs: [gateway, patch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and run the end-to-end suite under AppArmor
        # sudo: E2E_APPARMOR=1 loads the profile into the runner's kernel and
        # reads each process's AppArmor label from the host's /proc. It is root
        # on this throwaway VM only; the job's token stays contents: read.
        # If E2E_APPARMOR ever failed to reach the script through sudo, the suite
        # would quietly run unconfined and still pass, so the step also requires
        # the fence checks' own heading in the output.
        run: |
          set -o pipefail
          sudo E2E_APPARMOR=1 bash tests/e2e/run.sh | tee e2e-output.txt
          if ! grep -q '^# the AppArmor fence around /homeassistant$' e2e-output.txt; then
            echo "::error::the e2e suite did not run under AppArmor (no fence checks)"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-output
          path: tests/e2e/out/
          if-no-files-found: ignore

  # Auto-bump the version on every push to main (skips its own commit).
  bump-version:
    name: Auto-bump version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # pushes the version-bump commit
    # A push to main (not this job's own commit), or an Upstream sync branch every test passed on.
    if: >
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore: bump version')) ||
      (github.event_name == 'workflow_dispatch' &&
       startsWith(github.ref, 'refs/heads/upstream/opengym-'))
    needs: [gateway, patch, lint, ha-tests, smoke]
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bump_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # A dispatched run checks out main, so the check below is main's own tool, never the
          # branch's copy of it. A push run checks out its commit, as before.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
      - name: Land the tested upstream commit (Upstream sync runs only)
        id: land
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE: ${{ github.sha }}  # the commit every test job ran on
        run: |
          set -u
          git fetch --no-tags origin "$CANDIDATE"
          # Only exactly what Upstream sync makes from this main may land: one commit, the
          # Dockerfile pins and a changelog line (tools/upstream_sync.py landable).
          rc=0
          python3 tools/upstream_sync.py landable --base "$(git rev-parse HEAD)" --candidate "$CANDIDATE" || rc=$?
          case $rc in
            0) git merge --ff-only "$CANDIDATE"
               echo "landed=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice::main moved after ${CANDIDATE} was made from it; the next Upstream sync run rebuilds it on the new main."
               echo "landed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::${CANDIDATE} is not an Upstream sync commit on main; not landing it."
               exit 1 ;;
          esac
      - name: Bump config.yaml + both manifest.json + CHANGELOG.md in lockstep
        id: bump
        if: github.event_name == 'push' || steps.land.outputs.landed == 'true'
        env:
          # The triggering commit's SUBJECT decides the level: [major] or [minor]
          # bumps that component (and zeroes the lower ones); otherwise a patch.
          # tools/bump_version.py reads only the first line — a body that merely
          # mentions "[minor]" once turned a minor release into 1.0.0 in myMeal.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # A dispatched run has no head_commit; the landed commit (now HEAD) is the trigger.
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG=$(git log -1 --format=%B)
            export COMMIT_MSG
          fi
          python3 tools/bump_version.py
      - name: Commit version bump
        id: commit
        if: steps.bump.outcome == 'success'
        env:
          OLD: ${{ steps.bump.outputs.old_version }}
          NEW: ${{ steps.bump.outputs.new_version }}
          # The only branch this job pushes: push runs are main's, and a dispatched run lands on it.
          BRANCH: main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The add-on's bundled copy of the integration (opengym/integration/) carries the
          # same manifest.json; tools/addon_lint.py fails if the two ever differ.
          git add opengym/config.yaml custom_components/opengym/manifest.json \
            opengym/integration/opengym/manifest.json opengym/CHANGELOG.md
          git commit -m "chore: bump version ${OLD} → ${NEW}"
          # The bump sits on the commit this run tested; it is never rebased onto
          # a newer main, which would release commits whose tests have not run.
          # When main moved past this commit while CI ran (a second push waits in
          # the concurrency group), the push is rejected, and the newer push's own
          # run bumps and releases a tree that includes this commit: not a failure.
          # A lease rather than a plain push: main must still be the commit this job built on (the
          # tested commit on a push run, the main it checked out on a dispatched one). A plain push
          # also goes through when main was reset to an older commit meanwhile, and brings back what
          # the reset removed.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            expected=$(git rev-parse HEAD~2)
          else
            expected=$GITHUB_SHA
          fi
          if git push --force-with-lease="${BRANCH}:${expected}" origin "HEAD:${BRANCH}"; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BRANCH"
          # A dispatched run pushes two commits (the upstream one, then the bump) onto the main
          # it checked out, HEAD~2. If main has moved since, nothing landed: the next Upstream
          # sync run rebuilds the branch on the new main. If it has not, the push failed for
          # some other reason, which is an error.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$(git rev-parse "origin/$BRANCH")" != "$(git rev-parse HEAD~2)" ]; then
              echo "::notice::${BRANCH} moved while this run landed ${GITHUB_SHA}; the next Upstream sync run retries on it."
              exit 0
            fi
            echo "::error::could not push ${GITHUB_SHA} and its version bump to ${BRANCH}"
            exit 1
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH" \
            && [ "$(git rev-parse "origin/$BRANCH")" != "$GITHUB_SHA" ]; then
            echo "::notice::${BRANCH} moved past ${GITHUB_SHA} while CI ran; the newer run bumps and releases."
            exit 0
          fi
          echo "::error::could not push the version bump to ${BRANCH}, and ${BRANCH} has not moved past this commit"
          exit 1

  # Cut a GitHub release/tag per version: HACS reads releases to offer updates
  # to the integration, and the add-on store shows the version from config.yaml
  # at the tagged commit. Tags the bump commit, whose files already hold the
  # new version; with no bump pushed (main moved on, see bump-version) there is
  # nothing to tag and the newer run releases.
  release:
    name: GitHub release (HACS)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the GitHub release
    timeout-minutes: 10
    if: >
      ((github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'chore: bump version')) ||
       (github.event_name == 'workflow_dispatch' &&
        startsWith(github.ref, 'refs/heads/upstream/opengym-'))) &&
      needs.bump-version.outputs.bump_sha != ''
    needs: [bump-version]
    steps:
      - name: Create release v${{ needs.bump-version.outputs.new_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.bump-version.outputs.new_version }}
          SHA: ${{ needs.bump-version.outputs.bump_sha }}
          REPO: ${{ github.repository }}
        run: |
          # Retry on transient GitHub API failures. A 503 here is not cosmetic:
          # HACS validates the LATEST RELEASE, so a lost release leaves the repo
          # shipping a version HACS users cannot get (it happened to myMeal v0.5.7).
          create_release() {
            gh release create "v${V}" \
              --repo "$REPO" \
              --target "$SHA" \
              --title "v${V}" \
              --notes "openGym for Home Assistant ${V}: the add-on (built locally by the Supervisor from the official openGym images) and the HACS integration. See opengym/CHANGELOG.md."
          }

          if gh release view "v${V}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${V} already exists — skipping."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if create_release; then
              echo "Created release v${V} at ${SHA} (attempt ${attempt})"
              exit 0
            fi
            # Another run may have won the race between our check and our create.
            if gh release view "v${V}" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release v${V} appeared concurrently — nothing to do."
              exit 0
            fi
            backoff=$((attempt * 15))
            echo "Release creation failed (attempt ${attempt}/5); retrying in ${backoff}s." >&2
            sleep "$backoff"
          done

          echo "::error::Could not create release v${V} after 5 attempts. The repo" \
               "now ships a version with no release, and HACS serves the previous" \
               "one. Re-run this job, or create the release manually." >&2
          exit 1

  # An Upstream sync run that did not land, or landed but could not be released: say so where it
  # will be seen. Its failure email goes to the bot that dispatched it, not to a person. One open
  # issue per release, commented on by each later attempt; the Upstream sync workflow closes a
  # "could not be pulled in" issue once main pins that release. A run that ends without failing
  # (cancelled, timed out) is reported by the Upstream sync workflow's next check instead.
  upstream-failed:
    name: Report an upstream release that could not land
    if: >
      failure() && github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/upstream/opengym-')
    needs: [gateway, patch, lint, ha-tests, smoke, bump-version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write   # opens or comments on the issue; no checkout, no code run
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
          BUMP_SHA: ${{ needs.bump-version.outputs.bump_sha }}
        run: |
          set -euo pipefail
          version=${REF_NAME#upstream/opengym-}
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::unexpected branch ${REF_NAME}"; exit 1
          fi
          jobs=$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"')
          if [ -n "$BUMP_SHA" ]; then
            # It landed: main has it and its version bump (${BUMP_SHA}); only the release failed. A
            # title of its own, which the Upstream sync workflow never closes (main pins it already).
            title="openGym ${version} landed, but its GitHub release could not be made"
            body=$(cat <<EOF
          Upstream openGym [${version}](https://github.com/DuarteSantos8/openGym/releases/tag/v${version}) passed every test and is on main with its version bump (${BUMP_SHA}), but the GitHub release could not be created. The add-on store already offers it; HACS offers only the latest GitHub release, so the integration's users do not get this version until the release exists.

          Run: ${RUN_URL}

          ${jobs}

          Re-run the failed job, or create the release by hand at ${BUMP_SHA}, then close this issue.
          EOF
            )
          else
            # tools/upstream_sync.py ISSUE_TITLE: the Upstream sync workflow closes it by this title.
            title="openGym ${version} could not be pulled in automatically"
            body=$(cat <<EOF
          Upstream openGym [${version}](https://github.com/DuarteSantos8/openGym/releases/tag/v${version}) was tested on \`${REF_NAME}\` (${SHA}) and did not land, so users stay on the release main pins.

          Run: ${RUN_URL}

          ${jobs}

          The usual cause is the patch (\`opengym/patches/\`) no longer applying to upstream's \`api/server.js\`, or upstream changing something the gateway relies on. Fix it on main: any change on main makes the next Upstream sync run try ${version} again, and this issue closes itself once main pins it. A fix that has to pin ${version} by hand works too.
          EOF
            )
          fi
          # Only the bot's own issues: anyone can open one with this title.
          existing=$(gh issue list --repo "$REPO" --state open --author app/github-actions --limit 100 --json number,title \
            --search "in:title \"${title}\"" | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
