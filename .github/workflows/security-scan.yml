name: Security scan

# Quality/security gates, kept separate from CI so an upstream CVE or a scanner
# hiccup never blocks the release pipeline; results surface in the repo's
# Security tab (SARIF) and as job status on PRs. Two jobs block on purpose:
# dependency-review (a NEW vulnerable dependency in this PR is cheap to fix now)
# and gitleaks (a committed credential is a defect in THIS diff).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1" # weekly, Monday 06:27 UTC — catch newly-disclosed CVEs

concurrency:
  # Cancel superseded runs on the same PR only; scheduled and push runs finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read-only by default. Only the two jobs that upload SARIF
# (codeql, trivy-fs) get security-events: write; actions: read is what
# codeql-action needs to read the run it belongs to.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # uploads the SARIF results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The gateway and the patch's tests are JavaScript; the integration and
        # tools/ are Python. Both are interpreted: no build step.
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # `languages` (plural) is the input's name in init/action.yml at this
          # SHA. The singular `language` the sibling repos pass is not an input
          # of this action.
          languages: ${{ matrix.language }}
          # Query suite + path exclusions live in the config file, with the
          # reasoning for each narrowing recorded alongside them.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency review (PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocking: fails a PR that ADDS a dependency with a known high/critical
      # advisory (a Dependabot bump of the HA test harness, a new gateway dep).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  trivy-fs:
    name: Trivy filesystem + config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # uploads the SARIF results
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        # Pinned three ways, because Trivy's own release channels were hijacked in
        # March 2026 (GHSA-69fq-xp46-6x23: a malicious v0.69.4 and "latest"):
        # install.sh from the commit tagged v0.76.1, told to install exactly
        # v0.76.1 (an immutable GitHub release; the script checks the tarball
        # against that release's checksums file), and the installed binary checked
        # against the sha256 recorded here (the `trivy` file inside
        # trivy_0.76.1_Linux-64bit.tar.gz, whose own sha256 c7cbe313...39d9c0 is the
        # release's). To bump, change all three together.
        env:
          TRIVY_INSTALL_SH: https://raw.githubusercontent.com/aquasecurity/trivy/e713f67f7d54decdcd9b3132c9751833dcced698/contrib/install.sh
          TRIVY_VERSION: v0.76.1
          TRIVY_SHA256: d1dfca6ae10a1ad4540bb94e64f0510077c47008920a9b554986b39dca573d83
        run: |
          # Retry the download: this is a third-party CDN, and a transient 302 or
          # 5xx here means "the tool could not run", which is not a security
          # finding and must not fail the job. The SBOM job went red exactly
          # this way in a sibling repo.
          for attempt in 1 2 3; do
            if curl -sfL -o "$RUNNER_TEMP/trivy-install.sh" "$TRIVY_INSTALL_SH" \
              && sh "$RUNNER_TEMP/trivy-install.sh" -b /usr/local/bin "$TRIVY_VERSION"; then
              break
            fi
            echo "trivy install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          if [ ! -x /usr/local/bin/trivy ]; then
            echo "::warning::could not install Trivy after 3 attempts — skipping the scan"
            exit 0
          fi
          # A mismatch is not an outage: something served other bytes than the
          # pinned release. Never run that binary, and say so loudly.
          if ! echo "$TRIVY_SHA256  /usr/local/bin/trivy" | sha256sum -c --quiet; then
            rm -f /usr/local/bin/trivy
            echo "::error::the installed trivy does not match TRIVY_SHA256; refusing to run it"
            exit 1
          fi
      - name: Scan repo (vulns, misconfig, secrets) → SARIF
        run: |
          # If the install gave up, skip rather than fail on a missing binary:
          # otherwise the retry above just moves the red one step to the right.
          if [ ! -x /usr/local/bin/trivy ]; then
            echo "::warning::Trivy is not installed — scan skipped"
            exit 0
          fi
          # Advisory (--exit-code 0): findings land in the Security tab. Accepted
          # findings, each with its reason, are in .trivyignore (read by default).
          /usr/local/bin/trivy fs --scanners vuln,misconfig,secret \
            --format sarif --output trivy.sarif \
            --severity HIGH,CRITICAL --exit-code 0 .
      - name: Upload SARIF
        if: hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, not just the tip commit
          persist-credentials: false
      - name: Install & run gitleaks
        env:
          # sha256 of gitleaks_8.21.2_linux_x64.tar.gz, as listed in that release's
          # gitleaks_8.21.2_checksums.txt (checked 2026-10-22). Bump it with the URL.
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          # Retry the download only. A transient CDN failure is not a secret
          # leak; the scan itself still fails the job when it finds one.
          for attempt in 1 2 3; do
            curl -sfL -o gitleaks.tar.gz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz && break
            echo "gitleaks download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          if [ ! -s gitleaks.tar.gz ]; then
            echo "::warning::could not download gitleaks — scan skipped"
            exit 0
          fi
          # A mismatch is not an outage: never run a binary that is not the pinned one.
          if ! echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c --quiet; then
            echo "::error::gitleaks.tar.gz does not match GITLEAKS_SHA256; refusing to run it"
            exit 1
          fi
          tar -xzf gitleaks.tar.gz gitleaks
          # Blocking on purpose: a committed credential is a defect in THIS diff
          # and is actionable immediately, unlike an upstream CVE or an outage.
          # .gitleaks.toml allowlists named test fixtures by exact value only.
          ./gitleaks detect --source . --redact --verbose

  sbom:
    name: SBOM (SPDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisory: this job PRODUCES an artifact, it cannot report a finding. In a
      # sibling repo it failed once because syft's release download returned a
      # 302 — a third-party CDN hiccup must not turn the Security tab red. It
      # covers this repo's own manifests; the upstream images the Supervisor
      # builds from are openGym's to inventory.
      - continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: opengym-ha-sbom.spdx.json
