# Fake Home Assistant ingress for tests/e2e/run.sh. It runs at EXACTLY 172.30.32.2, the
# Supervisor's ingress address that the gateway trusts (contract §6), and does what the
# Supervisor's ingress proxy does for the add-on:
#   - strips the /api/hassio_ingress/<token>/ prefix before forwarding to the add-on's port;
#   - sets X-Remote-User-Id/-Name/-Display-Name for the signed-in HA user. proxy_set_header
#     REPLACES a header of the same name sent by the client (nginx does not forward the
#     client's copy of any header it sets), so a browser cannot choose its own HA identity;
#   - sets X-Ingress-Path, X-Forwarded-Host and X-Forwarded-Proto.
# Two HA users, one per prefix (a real Supervisor tells them apart by HA's session cookie):
#   /api/hassio_ingress/abc/  -> "Alex Example" (opens openGym first: becomes its admin)
#   /api/hassio_ingress/xyz/  -> "Zoë Ørsted"   (non-ASCII, sent as UTF-8 bytes like aiohttp)
# /panel.html frames /api/hassio_ingress/abc/ the way the HA sidebar panel does.

server {
    listen 80;
    server_name _;
    # No nginx size limit: the add-on's own is 48 MB (MEDIA_UPLOAD_MAX), and the Supervisor's
    # 16 MiB rule for non-POST bodies is emulated in fake-ingress-proxy.inc.
    client_max_body_size 0;

    location = /panel.html {
        root /usr/share/nginx/fake-ha;
    }

    location /api/hassio_ingress/abc/ {
        proxy_pass http://172.30.33.10:8099/;
        proxy_set_header X-Remote-User-Id 6a1f0c9d2b4e4f8a9c3d5e7f1a2b3c4d;
        proxy_set_header X-Remote-User-Name alex;
        proxy_set_header X-Remote-User-Display-Name "Alex Example";
        proxy_set_header X-Ingress-Path /api/hassio_ingress/abc;
        include /etc/nginx/fake-ha-proxy.inc;
    }

    location /api/hassio_ingress/xyz/ {
        proxy_pass http://172.30.33.10:8099/;
        proxy_set_header X-Remote-User-Id 9b8e7d6c5a4f4e3d8c2b1a0f9e8d7c6b;
        proxy_set_header X-Remote-User-Name zoe;
        proxy_set_header X-Remote-User-Display-Name "Zoë Ørsted";
        proxy_set_header X-Ingress-Path /api/hassio_ingress/xyz;
        include /etc/nginx/fake-ha-proxy.inc;
    }

    location / {
        return 404;
    }
}
